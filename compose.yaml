services:
  postgres:
    container_name: book-catalogue-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME}
      POSTGRES_PASSWORD: ${DEV_DATABASE_PASSWORD}
      POSTGRES_USER: ${DEV_DATABASE_USERNAME}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: