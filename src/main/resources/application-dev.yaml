spring:
  # datasource automatically generated by spring docker compose support
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: true
  override-with-generic-response: false

logging:
  level:
    'io.github.khaytul_illia.book_catalogue_api': DEBUG